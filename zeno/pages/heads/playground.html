<style>
  :root {
    --bg: #0b1020; --panel: #121931; --panel2: #0e152a; --line: #22304f;
    --text: #e6ecff; --dim: #93a2c8; --accent: #57e0b0; --accent2: #7aa2ff;
    --warn: #ffc46b; --err: #ff7b8a; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 20% -10%, #16224a 0%, var(--bg) 55%);
    color: var(--text); font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    padding: 22px 24px 16px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; justify-content: space-between;
  }
  h1 { font-size: 19px; margin: 0; letter-spacing: .2px; }
  h1 span { color: var(--accent); }
  .tag { color: var(--dim); font-size: 13px; }
  main { padding: 20px 24px 60px; max-width: 1180px; margin: 0 auto; }
  .grid { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
  }
  .panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 0 0 10px; }
  textarea, input[type=text] {
    width: 100%; background: #0a1122; color: var(--text); border: 1px solid var(--line);
    border-radius: 9px; padding: 11px 12px; font-family: var(--mono); font-size: 13.5px; resize: vertical;
  }
  textarea:focus, input:focus { outline: 2px solid #2b4270; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button {
    background: #1b2745; color: var(--text); border: 1px solid var(--line); border-radius: 9px;
    padding: 9px 14px; font-size: 13.5px; cursor: pointer; transition: .15s;
  }
  button:hover { border-color: var(--accent2); transform: translateY(-1px); }
  button.primary { background: linear-gradient(180deg, #2dd4a7 0%, #1aa07c 100%); color: #05231b; border: none; font-weight: 600; }
  button.ghost { background: transparent; }
  pre {
    background: #0a1122; border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px;
    overflow: auto; font-family: var(--mono); font-size: 13px; margin: 0; white-space: pre-wrap; word-break: break-word;
  }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 12px; }
  .stat { background: #0a1122; border: 1px solid var(--line); border-radius: 10px; padding: 9px 13px; min-width: 108px; }
  .stat b { display: block; font-size: 19px; font-family: var(--mono); }
  .stat small { color: var(--dim); font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; }
  .good { color: var(--accent); } .mid { color: var(--warn); } .bad { color: var(--err); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip {
    background: #16203c; border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent2); }
  .muted { color: var(--dim); font-size: 12.5px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); cursor: pointer; font-size: 13px; color: var(--dim); }
  .tab.active { background: #1b2745; color: var(--text); border-color: var(--accent2); }
  footer { color: var(--dim); font-size: 12.5px; padding: 18px 24px 40px; text-align: center; }
  code { font-family: var(--mono); color: var(--accent2); }
</style>
