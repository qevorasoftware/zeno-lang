<style>
  :root {
    --bg: #070b14; --card: #101827; --card-2: #131d30; --line: #1e2b42; --line-soft: #182338;
    --ink: #e8eefb; --dim: #93a4c1; --faint: #5f7391;
    --accent: #38e1d0; --accent-2: #7c8cff; --ok: #4ade80; --warn: #ffb454; --bad: #ff6b81;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--ink); font: 15px/1.55 var(--sans);
    background:
      radial-gradient(900px 460px at 10% -10%, rgba(56,225,208,.10), transparent 60%),
      radial-gradient(800px 420px at 95% 0%, rgba(124,140,255,.12), transparent 55%),
      var(--bg);
  }
  a { color: var(--accent); }
  header {
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    background: rgba(7,11,20,.85); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px);
  }
  .brand { font-weight: 650; display: flex; gap: 9px; align-items: center; }
  .brand .mark { width: 27px; height: 27px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: #05121a; font-weight: 800; }
  .pill { border: 1px solid var(--line); background: var(--card-2); color: var(--dim);
    padding: 4px 11px; border-radius: 999px; font-size: 12px; }
  .pill.ok { color: var(--ok); border-color: rgba(74,222,128,.35); }
  .pill.warn { color: var(--warn); border-color: rgba(255,180,84,.35); }
  .pill.bad { color: var(--bad); border-color: rgba(255,107,129,.35); }
  .spacer { flex: 1; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 70px; }
  .layout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
  .card { background: linear-gradient(180deg, var(--card), #0b1220); border: 1px solid var(--line);
    border-radius: 14px; padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,.4); margin-bottom: 16px; }
  .card h2 { margin: 0 0 11px; font-size: 12px; letter-spacing: 1.3px; text-transform: uppercase; color: var(--dim); }
  .card h2 .sub { text-transform: none; letter-spacing: 0; color: var(--faint); font-weight: 400; }
  button { background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 13px; font: 600 13px var(--sans); cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: linear-gradient(140deg, var(--accent), var(--accent-2)); color: #06131b; border: none; }
  button.ghost { background: transparent; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, select, textarea { background: #0a1120; color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; padding: 9px 11px; font: 14px var(--mono); }
  input:focus, select:focus, textarea:focus { outline: 2px solid rgba(56,225,208,.35); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .mic { width: 100%; padding: 26px; font-size: 19px; border-radius: 16px; }
  .mic.listening { background: linear-gradient(140deg, var(--bad), #b23a52); color: #fff; border: none;
    animation: breathe 1.6s infinite; }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(255,107,129,.5);} 50% { box-shadow: 0 0 0 12px rgba(255,107,129,0);} }
  #log { height: 320px; overflow: auto; background: #070d18; border: 1px solid var(--line-soft);
    border-radius: 12px; padding: 12px; font: 13.5px/1.6 var(--mono); }
  .turn { margin: 7px 0; }
  .turn .who { color: var(--faint); font-size: 11.5px; letter-spacing: .6px; }
  .turn.me .text { color: var(--accent); }
  .turn.agent .text { color: var(--ink); }
  .turn.sys .text { color: var(--dim); }
  .turn.err .text { color: var(--bad); }
  .turn .meta { color: var(--faint); font-size: 11px; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; border-bottom: 1px dashed var(--line-soft); font-size: 13px; }
  .stat:last-child { border-bottom: none; }
  .stat span { color: var(--dim); }
  .stat b { font-family: var(--mono); font-weight: 600; }
  .muted { color: var(--faint); font-size: 12.5px; }
  .warning { border-left: 3px solid var(--warn); background: rgba(255,180,84,.07); padding: 9px 11px; border-radius: 8px; font-size: 13px; }
  pre { background: #070d18; border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px;
    overflow: auto; font-size: 12px; color: #cfe0ff; margin: 8px 0 0; }
  .peer { border: 1px solid var(--line-soft); border-radius: 10px; padding: 9px 11px; margin-bottom: 8px; }
  .peer .name { font-family: var(--mono); }
</style>
